name: LVGL Simulator

on:
  pull_request:
    paths:
      - "lv_port_pc_vscode/**"
      - ".github/workflows/lvgl-sim.yml"
  push:
    branches: [main, master]
    paths:
      - "lv_port_pc_vscode/**"
      - ".github/workflows/lvgl-sim.yml"
  workflow_dispatch:

jobs:
    build-lvgl-sim:
      name: Build LVGL Simulator
      runs-on: ubuntu-latest
      
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          # No submodules needed since you're storing the full simulator in your repo

        - name: Install dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build libsdl2-dev xvfb

        - name: Configure
          working-directory: lv_port_pc_vscode
          run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

        - name: Build
          working-directory: lv_port_pc_vscode
          run: cmake --build build --parallel

        - name: Smoke test (headless)
          working-directory: lv_port_pc_vscode
          run: |
            set +e
            timeout 10s xvfb-run -a ./build/bin/main
            rc=$?
            set -e
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
              echo "Simulator exited with unexpected status: $rc"
              exit $rc
            fi
            echo "✓ Simulator ran successfully!"

        - name: Upload build artifacts (optional)
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: lvgl-simulator-build
            path: |
              lv_port_pc_vscode/build/bin/
              lv_port_pc_vscode/build/*.log
            if-no-files-found: ignore