name: LVGL Simulator

on:
  pull_request:
    paths:
      - "SCREEN_TEST/**"
      - ".github/workflows/lvgl-sim.yml"
  push:
    branches: [main, master]
    paths:
      - "SCREEN_TEST/**"
      - ".github/workflows/lvgl-sim.yml"
  workflow_dispatch:

jobs:
  build-lvgl-sim:
    name: Build and Test LVGL Simulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libsdl2-dev \
            libsdl2-image-dev \
            libevdev-dev \
            libevdev2 \
            xvfb \
            x11-apps \
            xdotool \
            scrot \
            imagemagick

      - name: Clone LVGL Linux port
        run: |
          git clone --recursive https://github.com/lvgl/lv_port_linux.git

      - name: Patch lv_conf.defaults for SDL
        working-directory: lv_port_linux
        run: |
          python3 -c "
          path = 'lv_conf.defaults'
          src = open(path).read()
          src = src.replace('LV_USE_LINUX_FBDEV      1', 'LV_USE_LINUX_FBDEV      0')
          src = src.replace('LV_USE_SDL              0', 'LV_USE_SDL              1')
          src = src.replace('LV_SDL_ACCELERATED      1', 'LV_SDL_ACCELERATED      0')
          src = src.replace('LV_USE_EVDEV    1',         'LV_USE_EVDEV    0')
          open(path, 'w').write(src)
          print('Patched lv_conf.defaults')
          "
          echo "--- verify ---"
          grep -E "LV_USE_SDL|LV_USE_LINUX_FBDEV|LV_USE_EVDEV|LV_SDL_ACCELERATED" lv_conf.defaults

      - name: Copy UI files to lv_port_linux/src/ui/
        run: |
          rm -rf lv_port_linux/src/ui
          mkdir -p lv_port_linux/src/ui/

          sed -i 's|\\&amp;|\\&|g; s|\\<|\\<|g; s|\\>|\\>|g' SCREEN_TEST/SCREEN_TEST/main/ui.c
          cp SCREEN_TEST/SCREEN_TEST/main/ui.h lv_port_linux/src/ui/
          cp SCREEN_TEST/SCREEN_TEST/main/ui.c lv_port_linux/src/ui/ui.c
          echo "✅ Copied and pre-sanitized ui.c/ui.h"

          python3 -c "
          path = 'lv_port_linux/src/ui/ui.c'
          src = open(path).read()
          src = src.replace('&amp;', '&')
          src = src.replace('<', '<')
          src = src.replace('>', '>')
          src = src.replace('lv_anim_set_playback_duration', 'lv_anim_set_reverse_duration')
          open(path, 'w').write(src)
          remaining = src.count('&amp;')
          print('Sanitized. Remaining occurrences: ' + str(remaining))
          "
          echo "--- verify no leftover entities ---"
          grep -n "amp;" lv_port_linux/src/ui/ui.c && echo "❌ Still dirty!" || echo "✅ Clean"

          echo "Files in src/ui:"
          ls -la lv_port_linux/src/ui/

      - name: Patch lv_port_linux to use our UI
        run: |
          echo "--- current demo calls in main.c ---"
          grep -n "demo\|Demo\|app_main\|ui_init" lv_port_linux/src/main.c | head -30

          sed -i 's|#include "lvgl/lvgl.h"|#include "lvgl/lvgl.h"\n#include "ui/ui.h"|' \
            lv_port_linux/src/main.c

          sed -i 's|lv_demo_widgets(|ui_init(lv_display_get_default()|' lv_port_linux/src/main.c
          sed -i 's|lv_demo_benchmark(|ui_init(lv_display_get_default()|' lv_port_linux/src/main.c
          sed -i 's|lv_demo_music(|ui_init(lv_display_get_default()|' lv_port_linux/src/main.c
          sed -i 's|lv_demo_stress(|ui_init(lv_display_get_default()|' lv_port_linux/src/main.c

          sed -i 's/lv_demo_widgets_start_slideshow();//' lv_port_linux/src/main.c
          sed -i '/lv_demo_widgets_start_slideshow()/s/^/# /; /lv_demo_widgets_start_slideshow()/s/$/ # Disabled to fix black UI/' lv_port_linux/src/main.c

          echo "--- patched main.c (relevant lines) ---"
          grep -n "demo\\|Demo\\|ui_init\\|ui\\.h\\|slideshow" lv_port_linux/src/main.c

          CMAKE="lv_port_linux/CMakeLists.txt"
          sed -i 's|src/main.c|src/main.c\n    src/ui/ui.c|' "$CMAKE"
          sed -i 's|include_directories(src)|include_directories(src)\ninclude_directories(src/ui)|' "$CMAKE"

          echo "--- patched CMakeLists.txt ---"
          cat "$CMAKE"

      - name: Configure
        working-directory: lv_port_linux
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: lv_port_linux
        run: |
          cd build
          cmake --build . --parallel

      - name: Check available backends
        working-directory: lv_port_linux
        run: |
          build/bin/lvglsim -B || true

      - name: Test simulator (headless, with screenshot)
        working-directory: lv_port_linux
        run: |
          set +e

          # Start Xvfb virtual display
          Xvfb :99 -screen 0 800x480x24 -ac &
          XVFB_PID=$!
          sleep 2

          # ✅ FIX #1: Export DISPLAY so the simulator and all subprocesses
          # can find the virtual display. Without this, SDL calls XOpenDisplay()
          # and gets NULL → falls back to nothing → black screenshot.
          export DISPLAY=:99

          echo "✅ Launching SDL simulator..."
          build/bin/lvglsim -b sdl &
          SIM_PID=$!

          # ✅ FIX #2: Give LVGL more time to initialize + render first frame.
          # LVGL does: init → theme load → widget tree build → first lv_timer_handler tick
          # On a cold CI runner this can take 5-10s before pixels appear.
          echo "Waiting for UI to render..."
          sleep 20

          # Screenshot with retries
          for i in {1..5}; do
            scrot screenshot.png
            size=$(stat -c%s screenshot.png 2>/dev/null || echo 0)
            echo "Attempt $i: file size = $size bytes"

            if [ "$size" -gt 5000 ]; then
              # ✅ FIX #3: ImageMagick 'mean' output is a float like "12345.6",
              # NOT "0,0,0" — the old regex would NEVER match so it always retried.
              mean=$(identify -quiet -format '%[fx:mean]' screenshot.png 2>/dev/null || echo "0")
              echo "Mean pixel value: $mean"
              if [ "$mean" != "0" ] && [ "$mean" != "0.0" ]; then
                echo "✅ Good screenshot captured!"
                break
              fi
            fi

            echo "Retry $i/5 — waiting..."
            sleep 3
          done

          kill $SIM_PID  2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true
          wait $SIM_PID  2>/dev/null || true
          wait $XVFB_PID 2>/dev/null || true

          [ -f screenshot.png ] && identify screenshot.png || echo "❌ No screenshot produced"