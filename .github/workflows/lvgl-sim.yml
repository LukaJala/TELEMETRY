name: LVGL Simulator

on:
  pull_request:
    paths:
      - "SCREEN_TEST/**"  # Trigger when UI files change
      - ".github/workflows/lvgl-sim.yml"
  push:
    branches: [main, master]
    paths:
      - "SCREEN_TEST/**"
      - ".github/workflows/lvgl-sim.yml"
  workflow_dispatch:

jobs:
  build-lvgl-sim:
    name: Build and Test LVGL Simulator
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout your code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libsdl2-dev \
            libevdev-dev \
            libevdev2 \
            xvfb \
            imagemagick

      - name: Clone LVGL Linux port
        run: |
          git clone --recursive https://github.com/lvgl/lv_port_linux.git
          
      - name: Copy UI files to lv_port_linux/src/ui/
        run: |
          # Remove existing UI if any, create fresh
          rm -rf lv_port_linux/src/ui
          mkdir -p lv_port_linux/src/ui
          
          # Copy UI files specifically (exclude ESP-IDF files)
          if [[ -f "SCREEN_TEST/SCREEN_TEST/main/ui.c" && -f "SCREEN_TEST/SCREEN_TEST/main/ui.h" ]]; then
            cp SCREEN_TEST/SCREEN_TEST/main/ui.c lv_port_linux/src/ui/
            cp SCREEN_TEST/SCREEN_TEST/main/ui.h lv_port_linux/src/ui/
            echo "✅ Copied ui.c and ui.h to lv_port_linux/src/ui/"
          else
            echo "❌ UI files not found in SCREEN_TEST/SCREEN_TEST/main/"
            exit 1
          fi
          
          echo "Files in src/ui:"
          ls -la lv_port_linux/src/ui/
      - name: Configure
        working-directory: lv_port_linux
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: lv_port_linux
        run: |
          cd build
          cmake --build . --parallel

      - name: Test simulator (headless, with screenshot)
        working-directory: lv_port_linux
        run: |
          set +e
          
          EXECUTABLE="build/bin/lvglsim"
          
          if [ ! -f "$EXECUTABLE" ] || [ ! -x "$EXECUTABLE" ]; then
            echo "❌ Build failed: no lvglsim"
            ls -la build/bin/ || true
            exit 1
          fi
          
          echo "✅ Running simulator for 5s and capturing screenshot..."
          
          # Run with xvfb, screenshot, upload artifact
          DISPLAY=:99 xvfb-run -a --server-args="-screen 0 1024x768x24 -ac" "$EXECUTABLE" -r 10 &
          SIM_PID=$!
          sleep 4  # Let UI render
          
          # Screenshot with import
          import -display :99 -window ROOT screenshot.png 2>/dev/null || true
          
          kill $SIM_PID 2>/dev/null || true
          wait $SIM_PID 2>/dev/null || true
          
          if [ -f screenshot.png ]; then
            echo "✅ Screenshot captured:"
            identify screenshot.png
          else
            echo "No screenshot (headless limitation)"
          fi
          
          echo "Screenshot saved (if visible):"
          ls -la screenshot.png || echo "No screenshot (headless ok)"
          echo "✅ Simulator test complete"
          
          # Upload screenshot as artifact
          echo "::group::Screenshot artifact"
          ls -la screenshot.png || echo "No screenshot"
          echo "::endgroup::"

          rc=0
