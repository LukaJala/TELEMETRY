name: LVGL Simulator

on:
  pull_request:
    paths:
      - "SCREEN_TEST/**"  # Trigger when UI files change
      - ".github/workflows/lvgl-sim.yml"
  push:
    branches: [main, master]
    paths:
      - "SCREEN_TEST/**"
      - ".github/workflows/lvgl-sim.yml"
  workflow_dispatch:

jobs:
  build-lvgl-sim:
    name: Build and Test LVGL Simulator
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout your code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libsdl2-dev \
            libevdev-dev \
            libevdev2 \
            xvfb

      - name: Clone LVGL Linux port
        run: |
          git clone --recursive https://github.com/lvgl/lv_port_linux.git
          
      - name: Copy UI files to lv_port_linux/src/ui/
        run: |
          # Remove existing UI if any, create fresh
          rm -rf lv_port_linux/src/ui
          mkdir -p lv_port_linux/src/ui
          
          # Copy UI files specifically (exclude ESP-IDF files)
          if [[ -f "SCREEN_TEST/SCREEN_TEST/main/ui.c" && -f "SCREEN_TEST/SCREEN_TEST/main/ui.h" ]]; then
            cp SCREEN_TEST/SCREEN_TEST/main/ui.c lv_port_linux/src/ui/
            cp SCREEN_TEST/SCREEN_TEST/main/ui.h lv_port_linux/src/ui/
            echo "✅ Copied ui.c and ui.h to lv_port_linux/src/ui/"
          else
            echo "❌ UI files not found in SCREEN_TEST/SCREEN_TEST/main/"
            exit 1
          fi
          
          echo "Files in src/ui:"
          ls -la lv_port_linux/src/ui/

      - name: Configure
        working-directory: lv_port_linux
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: lv_port_linux
        run: |
          cd build
          cmake --build . --parallel

      - name: Smoke test (headless)
        working-directory: lv_port_linux
        run: |
          set +e
          
          # The executable is lvglsim in the bin directory
          EXECUTABLE="build/bin/lvglsim"
          
          if [ ! -f "$EXECUTABLE" ] || [ ! -x "$EXECUTABLE" ]; then
            echo "❌ Could not find simulator executable at $EXECUTABLE"
            echo "📁 Build directory contents:"
            ls -la build/
            echo ""
            echo "📁 Build/bin contents:"
            ls -la build/bin/ 2>/dev/null || echo "build/bin/ does not exist"
            exit 1
          fi
          
          echo "✅ Found executable at: $EXECUTABLE"
          echo ""
          echo "🚀 Running simulator: $EXECUTABLE"
          echo "----------------------------------------"
          timeout 10s xvfb-run -a "$EXECUTABLE"
          rc=$?
          echo "----------------------------------------"
          
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "✅ Simulator ran for 10 seconds and was killed (timeout) - this is good!"
          elif [ "$rc" -eq 0 ]; then
            echo "✅ Simulator completed successfully"
          else
            echo "❌ Simulator exited with unexpected status: $rc"
            exit $rc
          fi