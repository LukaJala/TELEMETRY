name: LVGL Simulator

on:
  pull_request:
    paths:
      - "SCREEN_TEST/**"
      - ".github/workflows/lvgl-sim.yml"
  push:
    branches: [main, master]
    paths:
      - "SCREEN_TEST/**"
      - ".github/workflows/lvgl-sim.yml"
  workflow_dispatch:

jobs:
  build-lvgl-sim:
    name: Build and Test LVGL Simulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libsdl2-dev \
            libevdev-dev \
            libevdev2 \
            xvfb \
            x11-apps \
            xdotool \
            scrot \
            imagemagick

      - name: Clone LVGL Linux port
        run: |
          git clone --recursive https://github.com/lvgl/lv_port_linux.git

      - name: Copy UI files to lv_port_linux/src/ui/
        run: |
          rm -rf lv_port_linux/src/ui
          mkdir -p lv_port_linux/src/ui

          if [[ -f "SCREEN_TEST/SCREEN_TEST/main/ui.c" && -f "SCREEN_TEST/SCREEN_TEST/main/ui.h" ]]; then
            cp SCREEN_TEST/SCREEN_TEST/main/ui.c lv_port_linux/src/ui/
            cp SCREEN_TEST/SCREEN_TEST/main/ui.h lv_port_linux/src/ui/
            echo "✅ Copied ui.c and ui.h"
          else
            echo "❌ UI files not found in SCREEN_TEST/SCREEN_TEST/main/"
            exit 1
          fi

          # Sanitize with Python to avoid sed escaping headaches
          python3 -c "
          import sys
          path = 'lv_port_linux/src/ui/ui.c'
          src = open(path).read()
          src = src.replace('&amp;', '&')
          src = src.replace('&lt;', '<')
          src = src.replace('&gt;', '>')
          src = src.replace('lv_anim_set_playback_duration', 'lv_anim_set_reverse_duration')
          open(path, 'w').write(src)
          remaining = src.count('&amp;')
          print('Sanitized. Remaining occurrences: ' + str(remaining))
          "

          echo "--- verify no leftover entities ---"
          grep -n "amp;" lv_port_linux/src/ui/ui.c && echo "❌ Still dirty!" || echo "✅ Clean"

          echo "Files in src/ui:"
          ls -la lv_port_linux/src/ui/

      - name: Patch lv_port_linux to use our UI
        run: |
          echo "--- current demo calls in main.c ---"
          grep -n "demo\|Demo\|app_main\|ui_init" lv_port_linux/src/main.c | head -30

          # Add ui.h include after the lvgl include
          sed -i 's|#include "lvgl/lvgl.h"|#include "lvgl/lvgl.h"\n#include "ui/ui.h"|' \
            lv_port_linux/src/main.c

          # Replace whichever demo function is called with ui_init
          sed -i 's/lv_demo_widgets()/ui_init(lv_display_get_default())/' lv_port_linux/src/main.c
          sed -i 's/lv_demo_benchmark()/ui_init(lv_display_get_default())/' lv_port_linux/src/main.c
          sed -i 's/lv_demo_music()/ui_init(lv_display_get_default())/' lv_port_linux/src/main.c
          sed -i 's/lv_demo_stress()/ui_init(lv_display_get_default())/' lv_port_linux/src/main.c

          echo "--- patched main.c (relevant lines) ---"
          grep -n "demo\|Demo\|ui_init\|ui\.h" lv_port_linux/src/main.c

          CMAKE="lv_port_linux/CMakeLists.txt"

          # Add ui.c to the sources list
          sed -i 's|src/main.c|src/main.c\n    src/ui/ui.c|' "$CMAKE"

          # Add src/ui to include dirs
          sed -i 's|include_directories(src)|include_directories(src)\ninclude_directories(src/ui)|' "$CMAKE"

          echo "--- patched CMakeLists.txt ---"
          cat "$CMAKE"

      - name: Configure
        working-directory: lv_port_linux
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release
    
      - name: Build
        working-directory: lv_port_linux
        run: |
          cd build
          cmake --build . --parallel
      - name: Check available backends
        working-directory: lv_port_linux
        run: |
          build/bin/lvglsim -B || true
      - name: Debug simulator output
        working-directory: lv_port_linux
        run: |
          set +e
          
          Xvfb :99 -screen 0 800x600x24 -ac &
          XVFB_PID=$!
          sleep 1

          # Run with stdout/stderr visible so we can see LVGL logs
          echo "--- Running simulator for 6s ---"
          DISPLAY=:99 SDL_VIDEODRIVER=x11 SDL_VIDEO_X11_VISUALID="" \
            LIBGL_ALWAYS_SOFTWARE=1 \
            build/bin/lvglsim 2>&1 &
          SIM_PID=$!
          sleep 2

          # List all windows on :99 right after launch
          echo "--- Windows on :99 at t=2s ---"
          DISPLAY=:99 xdotool search --name "" 2>/dev/null || echo "No windows yet"
          DISPLAY=:99 xlsclients 2>/dev/null || true

          sleep 3  # wait for more frames

          echo "--- Windows on :99 at t=5s ---"
          DISPLAY=:99 xdotool search --name "" 2>/dev/null || echo "Still no windows"

          # Try screenshotting every window we can find
          for WIN in $(DISPLAY=:99 xdotool search --name "" 2>/dev/null); do
            echo "Trying window $WIN..."
            DISPLAY=:99 xwd -id "$WIN" -silent 2>/dev/null | convert xwd:- "win_${WIN}.png" 2>/dev/null && \
              identify "win_${WIN}.png" || true
          done

          # Also grab the full root
          DISPLAY=:99 scrot fullscreen.png 2>/dev/null || true
          [ -f fullscreen.png ] && identify fullscreen.png || echo "scrot failed"

          kill $SIM_PID  2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true
          wait $SIM_PID  2>/dev/null || true
          wait $XVFB_PID 2>/dev/null || true

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            lv_port_linux/win_*.png
            lv_port_linux/fullscreen.png
          if-no-files-found: warn

      - name: Test simulator (headless, with screenshot)
        working-directory: lv_port_linux
        run: |
          set +e

          EXECUTABLE="build/bin/lvglsim"

          if [ ! -f "$EXECUTABLE" ] || [ ! -x "$EXECUTABLE" ]; then
            echo "❌ Build failed: no lvglsim"
            ls -la build/bin/ || true
            exit 1
          fi

          # 1. Start Xvfb on a fixed display number
          Xvfb :99 -screen 0 800x600x24 -ac &
          XVFB_PID=$!
          sleep 1

          # 2. Launch simulator — force SDL to use X11 backend
          echo "✅ Launching simulator..."
          DISPLAY=:99 SDL_VIDEODRIVER=x11 "$EXECUTABLE" &
          SIM_PID=$!
          sleep 4

          # 3. Find the SDL window and screenshot it
          echo "✅ Capturing screenshot..."
          WIN_ID=$(DISPLAY=:99 xdotool search --sync --onlyvisible --name "" 2>/dev/null | head -1)

          if [ -n "$WIN_ID" ]; then
            echo "Found window ID: $WIN_ID"
            DISPLAY=:99 xwd -id "$WIN_ID" -silent | convert xwd:- screenshot.png 2>/dev/null
          else
            echo "No specific window found, falling back to scrot..."
            DISPLAY=:99 scrot screenshot.png 2>/dev/null || true
          fi

          # 4. Tear down
          kill $SIM_PID  2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true
          wait $SIM_PID  2>/dev/null || true
          wait $XVFB_PID 2>/dev/null || true

          if [ -f screenshot.png ]; then
            echo "✅ Screenshot captured:"
            identify screenshot.png
          else
            echo "❌ No screenshot"
          fi

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lvgl-screenshot
          path: lv_port_linux/screenshot.png
          if-no-files-found: warn