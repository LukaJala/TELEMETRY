name: LVGL Simulator

on:
  pull_request:
    paths:
      - "SCREEN_TEST/**"  # Trigger when UI files change
      - ".github/workflows/lvgl-sim.yml"
  push:
    branches: [main, master]
    paths:
      - "SCREEN_TEST/**"
      - ".github/workflows/lvgl-sim.yml"
  workflow_dispatch:

jobs:
  build-lvgl-sim:
    name: Build and Test LVGL Simulator
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout your code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsdl2-dev xvfb

      - name: Clone LVGL Simulator
        run: |
          git clone --recursive https://github.com/lvgl/lv_port_pc_vscode.git
          
      - name: Copy UI files from SCREEN_TEST to simulator
        run: |
          # Create UI directory in simulator
          mkdir -p lv_port_pc_vscode/src/my_ui
          
          # Copy your UI files (adjust path if your UI is elsewhere)
          if [ -d "SCREEN_TEST/SCREEN_TEST/main" ]; then
            cp -r SCREEN_TEST/SCREEN_TEST/main/* lv_port_pc_vscode/src/my_ui/
            echo "✅ Copied UI files from SCREEN_TEST"
          else
            echo "⚠️ No UI files found in SCREEN_TEST/SCREEN_TEST/main"
          fi
          
          # List what was copied
          echo "Files in my_ui:"
          ls -la lv_port_pc_vscode/src/my_ui/

      - name: Configure
        working-directory: lv_port_pc_vscode
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: lv_port_pc_vscode
        run: cmake --build build --parallel

      - name: Smoke test (headless)
        working-directory: lv_port_pc_vscode
        run: |
          set +e
          
          # Find the executable
          echo "🔍 Searching for simulator executable..."
          EXECUTABLE=""
          
          # Check common locations and names
          POSSIBLE_PATHS=(
            "./build/bin/main"
            "./build/main"
            "./build/bin/lvgl_sim"
            "./build/lvgl_sim" 
            "./build/bin/demo"
            "./build/demo"
            "./build/bin/lv_sim"
            "./build/lv_sim"
          )
          
          for path in "${POSSIBLE_PATHS[@]}"; do
            if [ -f "$path" ] && [ -x "$path" ]; then
              EXECUTABLE="$path"
              echo "✅ Found executable at: $EXECUTABLE"
              break
            fi
          done
          
          # If not found, try a broader search
          if [ -z "$EXECUTABLE" ]; then
            echo "🔍 Executable not in common locations, searching build directory..."
            EXECUTABLE=$(find build -type f -executable -name "main" -o -name "lvgl_sim" -o -name "demo" -o -name "lv_sim" | head -1)
            
            if [ -n "$EXECUTABLE" ]; then
              echo "✅ Found executable at: $EXECUTABLE"
            fi
          fi
          
          # If still not found, list directory contents for debugging
          if [ -z "$EXECUTABLE" ]; then
            echo "❌ Could not find simulator executable!"
            echo ""
            echo "📁 Contents of build directory:"
            ls -la build/
            echo ""
            echo "📁 Contents of build/bin (if exists):"
            ls -la build/bin/ 2>/dev/null || echo "build/bin/ does not exist"
            echo ""
            echo "📁 All executable files in build:"
            find build -type f -executable | head -20
            exit 1
          fi
          
          # Run the simulator
          echo ""
          echo "🚀 Running simulator: $EXECUTABLE"
          echo "----------------------------------------"
          timeout 10s xvfb-run -a "$EXECUTABLE"
          rc=$?
          echo "----------------------------------------"
          
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "✅ Simulator ran for 10 seconds and was killed (timeout) - this is good!"
          elif [ "$rc" -eq 0 ]; then
            echo "✅ Simulator completed successfully"
          else
            echo "❌ Simulator exited with unexpected status: $rc"
            exit $rc
          fi
      - name: Verify build succeeded
        working-directory: lv_port_pc_vscode
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Build directory not found!"
            exit 1
          fi
          
          # Check if build completed (look for CMake cache files)
          if [ ! -f "build/CMakeCache.txt" ]; then
            echo "❌ CMake configuration failed!"
            exit 1
          fi
          
          echo "✅ Build directory exists"
          echo "📊 Build directory size:"
          du -sh build/